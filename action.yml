name: "CertOne confidential compliance scan"
description: "Send the AI project to CertOne for a confidential scan in an attested TEE (AMD SEV-SNP or Kata confidential containers) and gate the job on the verdict."
author: "Certkor AI"
branding:
  icon: "shield"
  color: "blue"

inputs:
  api-key:
    description: "CertOne tenant API key (member role). Store it as a repository or organization secret."
    required: true
  path:
    description: "Path to the AI project inside the repository."
    required: false
    default: "."
  api-url:
    description: "CertOne platform URL."
    required: false
    default: "https://platform.certkor.ai"
  asset:
    description: "AI system name in CertOne (default: the repository name)."
    required: false
    default: ""
  tee:
    description: "Confidential computer for the scan: amd_sev_snp | kata_cc."
    required: false
    default: "amd_sev_snp"
  country-code:
    description: "Region where the AI system operates, e.g. EU, US, CA."
    required: false
    default: "ZZ"
  fail-on:
    description: "Severity that fails the job: low | medium | high | none."
    required: false
    default: "high"
  report:
    description: "Where to write the compliance report JSON."
    required: false
    default: "certone-report.json"
  attestation:
    description: "Where to write the attestation JSON of a passing verdict."
    required: false
    default: "certone-attestation.json"
  sarif:
    description: "Where to write the findings as SARIF 2.1.0 (upload with github/codeql-action/upload-sarif)."
    required: false
    default: "certone.sarif"
  soft-fail:
    description: "If 'true', always exit 0 (the verdict is still reported)."
    required: false
    default: "false"

outputs:
  verdict:
    description: "pass, fail or error."
    value: ${{ steps.scan.outputs.verdict }}
  scan-id:
    description: "The CertOne scan id."
    value: ${{ steps.scan.outputs.scan-id }}
  sarif-path:
    description: "Path to the SARIF file."
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the CertOne SDK
      shell: bash
      run: pip install --disable-pip-version-check --quiet "certone-sdk>=0.2.2"
    - name: Confidential scan on CertOne
      id: scan
      shell: bash
      env:
        CERTONE_API_KEY: ${{ inputs.api-key }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_ASSET: ${{ inputs.asset }}
        INPUT_TEE: ${{ inputs.tee }}
        INPUT_COUNTRY: ${{ inputs.country-code }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_ATTESTATION: ${{ inputs.attestation }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SOFT_FAIL: ${{ inputs.soft-fail }}
      run: |
        set -uo pipefail
        asset="${INPUT_ASSET:-${GITHUB_REPOSITORY#*/}}"
        certone-submit --project "$INPUT_PATH" --asset "$asset" --api "$INPUT_API_URL" \
          --environment ci --tee "$INPUT_TEE" --country-code "$INPUT_COUNTRY" \
          --fail-on "$INPUT_FAIL_ON" --snapshot-ref "git:${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
          --report-out "$INPUT_REPORT" --attestation-out "$INPUT_ATTESTATION" \
          --sarif-out "$INPUT_SARIF" --markdown-out "$GITHUB_STEP_SUMMARY" | tee certone-submit.log
        status=${PIPESTATUS[0]}
        scan=$(sed -n 's/.*: scan \([0-9a-f]*\) .*/\1/p' certone-submit.log | head -1)
        echo "scan-id=$scan" >> "$GITHUB_OUTPUT"
        case $status in
          0) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
          1) echo "verdict=fail" >> "$GITHUB_OUTPUT" ;;
          *) echo "verdict=error" >> "$GITHUB_OUTPUT"; exit $status ;;
        esac
        if [ "$INPUT_SOFT_FAIL" = "true" ]; then exit 0; fi
        exit $status
